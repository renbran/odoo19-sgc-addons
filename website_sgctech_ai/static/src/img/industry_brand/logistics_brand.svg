<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" role="img" aria-labelledby="title desc">
  <title id="title">SGC Logistics Brand Visual</title>
  <desc id="desc">Branded logistics illustration with freight route overlays, warehouse blocks, and live tracking signals.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07111f"/>
      <stop offset="58%" stop-color="#0a1630"/>
      <stop offset="100%" stop-color="#140c22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#7b2fbe"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1600" height="1200" fill="url(#bg)"/>
  <circle cx="1290" cy="210" r="220" fill="rgba(0,212,255,0.15)" filter="url(#glow)"/>
  <circle cx="250" cy="1000" r="240" fill="rgba(123,47,190,0.18)" filter="url(#glow)"/>
  <g transform="translate(120 150)">
    <rect x="0" y="0" rx="40" ry="40" width="1360" height="850" fill="rgba(9,15,28,0.72)" stroke="rgba(255,255,255,0.1)"/>
    <rect x="70" y="84" rx="24" ry="24" width="1220" height="250" fill="rgba(255,255,255,0.04)" stroke="rgba(0,212,255,0.18)"/>
    <rect x="70" y="382" rx="24" ry="24" width="640" height="390" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)"/>
    <rect x="760" y="382" rx="24" ry="24" width="530" height="390" fill="rgba(255,255,255,0.04)" stroke="rgba(123,47,190,0.18)"/>
  </g>
  <g transform="translate(220 275)">
    <path d="M42 190 C180 120, 310 164, 464 84 S730 18, 926 102" fill="none" stroke="url(#accent)" stroke-width="10" stroke-linecap="round" filter="url(#glow)"/>
    <circle cx="42" cy="190" r="12" fill="#00d4ff"/>
    <circle cx="464" cy="84" r="12" fill="#00e5a0"/>
    <circle cx="926" cy="102" r="12" fill="#7b2fbe"/>
    <circle cx="42" cy="190" r="30" fill="none" stroke="rgba(0,212,255,0.3)" stroke-width="4"/>
    <circle cx="464" cy="84" r="30" fill="none" stroke="rgba(0,229,160,0.3)" stroke-width="4"/>
    <circle cx="926" cy="102" r="30" fill="none" stroke="rgba(123,47,190,0.3)" stroke-width="4"/>
  </g>
  <g transform="translate(250 625)">
    <rect x="0" y="0" rx="18" ry="18" width="210" height="110" fill="rgba(255,255,255,0.08)"/>
    <rect x="236" y="-42" rx="18" ry="18" width="220" height="152" fill="rgba(255,255,255,0.08)"/>
    <rect x="492" y="22" rx="18" ry="18" width="170" height="88" fill="rgba(255,255,255,0.08)"/>
    <rect x="808" y="-24" rx="18" ry="18" width="170" height="134" fill="rgba(0,212,255,0.13)" stroke="rgba(0,212,255,0.35)"/>
    <rect x="1010" y="16" rx="18" ry="18" width="180" height="94" fill="rgba(123,47,190,0.14)" stroke="rgba(123,47,190,0.35)"/>
    <path d="M828 158 h152" stroke="#00d4ff" stroke-width="10" stroke-linecap="round"/>
    <path d="M1040 158 h120" stroke="#7b2fbe" stroke-width="10" stroke-linecap="round"/>
    <circle cx="852" cy="196" r="28" fill="#0b1628" stroke="rgba(255,255,255,0.3)"/>
    <circle cx="954" cy="196" r="28" fill="#0b1628" stroke="rgba(255,255,255,0.3)"/>
    <circle cx="1068" cy="196" r="28" fill="#0b1628" stroke="rgba(255,255,255,0.3)"/>
    <circle cx="1154" cy="196" r="28" fill="#0b1628" stroke="rgba(255,255,255,0.3)"/>
  </g>
</svg>