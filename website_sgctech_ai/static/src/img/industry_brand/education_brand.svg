<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" role="img" aria-labelledby="title desc">
  <title id="title">SGC Education Brand Visual</title>
  <desc id="desc">Branded education technology illustration with campus tiles, digital learning layers, and SGC brand gradients.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#081321"/>
      <stop offset="60%" stop-color="#0b1832"/>
      <stop offset="100%" stop-color="#11112a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="50%" stop-color="#00e5a0"/>
      <stop offset="100%" stop-color="#7b2fbe"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1600" height="1200" fill="url(#bg)"/>
  <circle cx="1260" cy="210" r="220" fill="rgba(123,47,190,0.16)" filter="url(#glow)"/>
  <circle cx="300" cy="1030" r="250" fill="rgba(0,212,255,0.12)" filter="url(#glow)"/>
  <g transform="translate(160 130)">
    <rect x="0" y="0" rx="42" ry="42" width="1240" height="840" fill="rgba(10,18,32,0.72)" stroke="rgba(255,255,255,0.1)"/>
    <rect x="60" y="70" rx="26" ry="26" width="1120" height="120" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)"/>
    <rect x="60" y="240" rx="26" ry="26" width="490" height="520" fill="rgba(255,255,255,0.04)" stroke="rgba(0,212,255,0.24)"/>
    <rect x="610" y="240" rx="26" ry="26" width="570" height="240" fill="rgba(255,255,255,0.04)" stroke="rgba(123,47,190,0.24)"/>
    <rect x="610" y="520" rx="26" ry="26" width="570" height="240" fill="rgba(255,255,255,0.04)" stroke="rgba(0,229,160,0.24)"/>
  </g>
  <g transform="translate(245 340)">
    <path d="M0 70 L230 0 L460 70 L230 140 Z" fill="url(#accent)" opacity="0.9" filter="url(#glow)"/>
    <path d="M78 126 v136 M230 126 v136 M382 126 v136" stroke="rgba(255,255,255,0.18)" stroke-width="18" stroke-linecap="round"/>
    <rect x="42" y="270" rx="20" ry="20" width="376" height="52" fill="rgba(255,255,255,0.09)"/>
    <circle cx="492" cy="44" r="22" fill="#00d4ff"/>
    <path d="M492 66 v92" stroke="#00d4ff" stroke-width="8" stroke-linecap="round"/>
  </g>
  <g transform="translate(820 315)">
    <rect x="0" y="0" rx="18" ry="18" width="310" height="130" fill="rgba(255,255,255,0.06)"/>
    <path d="M36 93 C90 40, 140 75, 196 56 S270 38, 284 28" fill="none" stroke="#00d4ff" stroke-width="8" stroke-linecap="round"/>
    <circle cx="88" cy="44" r="16" fill="#7b2fbe"/>
    <circle cx="194" cy="56" r="16" fill="#00e5a0"/>
    <circle cx="284" cy="28" r="16" fill="#ff6b35"/>
    <rect x="0" y="206" rx="18" ry="18" width="490" height="160" fill="rgba(255,255,255,0.05)"/>
    <rect x="30" y="236" rx="12" ry="12" width="90" height="100" fill="rgba(0,212,255,0.16)"/>
    <rect x="150" y="256" rx="12" ry="12" width="90" height="80" fill="rgba(123,47,190,0.16)"/>
    <rect x="270" y="214" rx="12" ry="12" width="90" height="122" fill="rgba(0,229,160,0.16)"/>
    <rect x="390" y="274" rx="12" ry="12" width="70" height="62" fill="rgba(255,107,53,0.16)"/>
